services:

  nodejs:
    build:
      context: ./nodejs
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./nodejs/.env
    environment:
      - PORT=8000
    networks:
      - payments
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    env_file:
      - ./php/.env
    networks:
      - payments
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  java:
    build:
      context: ./java
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    env_file:
      - ./java/.env
    networks:
      - payments
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  dotnet:
    build:
      context: ./dotnet
      dockerfile: Dockerfile
    ports:
      - "8006:8000"
    env_file:
      - ./dotnet/.env
    environment:
      - ASPNETCORE_URLS=http://+:8000
    networks:
      - payments
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Test runner — only started with: docker compose --profile testing up
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    depends_on:
      nodejs:
        condition: service_healthy
      php:
        condition: service_healthy
      java:
        condition: service_healthy
      dotnet:
        condition: service_healthy
    environment:
      - CI=true
      - NODE_BASE_URL=http://nodejs:8000
      - PHP_BASE_URL=http://php:8000
      - JAVA_BASE_URL=http://java:8000
      - DOTNET_BASE_URL=http://dotnet:8000
    networks:
      - payments
    profiles:
      - testing

networks:
  payments:
    driver: bridge
